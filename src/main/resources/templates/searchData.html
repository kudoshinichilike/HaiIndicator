<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/lib/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/lib/bootstrap-vue.min.css}"/>
    <link rel="stylesheet" th:href="@{/lib/vue-multiselect.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/fab.css}"/>
    <title>Search</title>
</head>

<style>
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button,
    input::-webkit-clear-button {
        -webkit-appearance: none;
        margin: 0;
    }
</style>

<body>
<div id="view-search-data">
    <template>
        <b-container fluid>
            <b-card class="mb-2 mt-5">
                <b-form-row>
                    <b-col lg="1" class="my-1">
                        Mã
                    </b-col>
                    <b-col lg="2" class="my-1">
                        <b-form-input v-model="code" :disabled="isSearching" placeholder="Nhập mã chứng khoán"
                                      list="listCodeSearch" type="search"></b-form-input>
                        <datalist id="listCodeSearch">
                            <option v-for="codeName in listCodeSearch">{{ codeName }}</option>
                        </datalist>
                    </b-col>
                </b-form-row>

                <b-form-row>
                    <b-col lg="1" class="my-1">
                        Ngày tìm kiếm
                    </b-col>
                    <b-col lg="2" class="my-1">
                        <b-input v-model="dateSearch" :disabled="isSearching" type="date"></b-input>
                    </b-col>
                </b-form-row>

                <b-form-row>
                    <b-col lg="1" class="my-1">
                        Nguồn dữ liệu
                    </b-col>
                    <b-col lg="2" class="my-1">
                        <b-form-input v-model="dataSource" :disabled="isSearching" placeholder="Nhập nguồn dữ liệu"
                                      list="listDataSource" type="search"></b-form-input>
                        <datalist id="listDataSource">
                            <option v-for="dataName in listDataSource">{{ dataName }}</option>
                        </datalist>
                    </b-col>
                </b-form-row>

                <b-form-row>
                    <b-col lg="1" class="my-1">
                        <b-button @click="onSearchClicked" variant="primary" block :disabled="isSearching">
                            Tìm kiếm
                        </b-button>
                    </b-col>
                </b-form-row>

            </b-card>

            <div class="row" v-if="dataSource == 'CAFE_F'">
                <div style="max-height: 800px; overflow-y: auto; width: 50%;" class="col-md-6 table-wrapper">
                    <b-button @click="onDownloadStatistic" variant="primary" block :disabled="isSearching">
                        Download as Excel
                    </b-button>
                    <b-table :items="dataTableStatistic" :fields="fieldsTableStatistic" class="table-striped"></b-table>
                </div>

                <!-- Second Table -->
                <div style="max-height: 800px; overflow-y: auto; width: 50%;" class="table-wrapper col-md-6 text-right">
                    <b-button @click="onDownloadDetails" variant="primary" block :disabled="isSearching">
                        Download as Excel
                    </b-button>
                    <b-table :items="dataTableDetails" :fields="fieldsTableDetails" class="table-striped"></b-table>
                </div>
            </div>

            <div class="row" v-if="dataSource == 'RONG_VIET'">
                <div style="max-height: 800px; overflow-y: auto; width: 50%;" class="col-md-6 table-wrapper">
                    <b-button @click="onDownloadVDS" variant="primary" block :disabled="isSearching">
                        Download VDS as Excel
                    </b-button>
                    <b-table :items="dataTableVDS" :fields="fieldsTableVDS" class="table-striped"></b-table>
                </div>
            </div>
        </b-container>
    </template>
</div>

<script th:src="@{/lib/axios.min.js}"></script>
<script th:src="@{/lib/vue.min.js}"></script>
<script th:src="@{/lib/bootstrap-vue.min.js}"></script>
<script th:src="@{/lib/vue-multiselect@2.1.0.js}"></script>
<script th:src="@{/js/utils.js}"></script>
<script th:src="@{/js/conf_fab.js}"></script>
<script th:src="@{/lib/xlsx.full.min.js}"></script>
<script th:src="@{/js/searchData.js}"></script>
</body>

</html>
